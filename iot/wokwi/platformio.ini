; Projet PlatformIO pour compiler sketch.ino et le simuler avec l'extension Wokwi de VS Code.
; Compilation : pio run   (ou bouton ✓ "Build" de PlatformIO)
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; PlatformIO convertit sketch.ino en sketch.ino.cpp : c est ce fichier qu il faut compiler
build_src_filter = +<sketch.ino.cpp>
lib_deps =
    beegee-tokyo/DHT sensor library for ESPx
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7
