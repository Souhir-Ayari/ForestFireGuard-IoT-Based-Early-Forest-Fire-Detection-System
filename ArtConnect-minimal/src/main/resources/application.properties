spring.application.name=ArtConnect-minimal
server.port=8080

# Base H2 en mémoire (recréée à chaque démarrage)
spring.datasource.url=jdbc:h2:mem:artconnect
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# TP 1) "Create the tables in the database" : c'est NOUS qui créons la table, dans schema.sql.
# Hibernate ne la génère pas : "validate" vérifie seulement que l'entité Artist correspond à la table.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
